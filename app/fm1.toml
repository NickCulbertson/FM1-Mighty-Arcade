# Mighty Arcade on fm1-base (tools/build.py), from Mighty Arp's stack
name = "MightyArcade"
id_prefix = "FM-1_6281"       # package identity: dev FM-1_628100, releases FM-1_6281XXYY (tools/xxyy.py, as Mighty Arp: 1.0 is FM-1_62810100, 8 digits, the Firmware Hub's longest)
usb_manufacturer = "Nick Culbertson"
usb_product = "Mighty Arcade FM-1"
o2 = ["dsp/engine.c"]          # the sound, compiled at -O2 (the unity build is -Os)
words = "words.tsv"
ble = false
cpu2 = true                    # the second core renders part of the voices
cpu2_fallback = true
tagline = "18 music-making games"
repo = "https://github.com/NickCulbertson/FM1-Mighty-Arcade"
licence = "MPL-2.0"
credits = "Built on fm1-base by Charles Vestal and felucca-bsp; the sound engine is Mighty Arp's"
title = "Mighty Arcade"
author = "Moby Pixel"
description = "Mighty Arcade, from the creator of Mighty Arp: eighteen casual games, from chess and solitaire to pinball and arcade classics, every one a sequencer. Each move, each card, each cleared row plays the music. One player or two."
tags = ["synth"]
install = "https://nickculbertson.github.io/FM1-Mighty-Arcade/install/"
site = "https://nickculbertson.github.io/FM1-Mighty-Arcade/"
screenshot = "app/docs/img/menu.png"   # for the hubs' cards: square, 240 x 240
